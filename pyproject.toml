[project]
name = "kiss"
version = "0.1.0"
description = "A small terminal text editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyfiglet>=1.0.4",
    "textual[syntax]>=8.2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "ty",
]
[project.scripts]
kiss = "kiss.app:run"

[tool.uv]
package = true
