[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "kiss-editor"
version = "0.3.7"
description = "A small terminal text editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual-image[textual]>=0.13.2",
    "textual[syntax]>=8.2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.21",
    "ty",
]
[project.scripts]
kiss = "kiss_editor.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=kiss_editor --cov-report=term-missing"
filterwarnings = [
    "ignore::RuntimeWarning:runpy",
]

[tool.uv]
package = true
