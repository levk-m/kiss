[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "kiss-editor"
version = "0.1.1"
description = "A small terminal text editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual[syntax]>=8.2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "ty",
]
[project.scripts]
kiss = "kiss_editor.app:run"

[tool.uv]
package = true
